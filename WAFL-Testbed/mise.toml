[tools]
python = "3.11.4"
uv = "0.7.13"

[env]
mise.file = ".env"

[tasks.rsync]
description = "Sync project files to management server (optimized single rsync call)"
run = [
  "rsync -arhvz --progress --delete --inplace ./.env ./mise.toml ./uv.lock ./pyproject.toml ./Dockerfile ./.dockerignore ./ctrl ./wafl ./data ./utils ${DEPLOY_CTRL_SERVER_USER}@${DEPLOY_CTRL_SERVER_HOST}:${DEPLOY_CTRL_SERVER_DIST}/",
]

[tasks.setup]
depends = ["rsync"]
run = [
  "uv venv",
  ". .venv/bin/activate",
  "uv sync --link-mode=copy",
  "uv run pre-commit install || true",
  "ssh ${DEPLOY_CTRL_SERVER_USER}@${DEPLOY_CTRL_SERVER_HOST} \"cd ${DEPLOY_CTRL_SERVER_DIST} && bash ctrl/setup.sh\"",
]

[tasks.lint]
run = [
  "uv run ruff check --fix",
]

[tasks.deploy]
description = "Build Docker image on management server and push to registry, then pull on all nodes"
depends = ["rsync"]
run = [
  "echo '📦 Setting up Python environment on management server...'",
  "ssh ${DEPLOY_CTRL_SERVER_USER}@${DEPLOY_CTRL_SERVER_HOST} \"cd ${DEPLOY_CTRL_SERVER_DIST} && ~/.local/bin/uv venv --clear && source .venv/bin/activate && ~/.local/bin/uv sync\"",
  "echo '🏗️  Building Docker image on management server...'",
  "ssh ${DEPLOY_CTRL_SERVER_USER}@${DEPLOY_CTRL_SERVER_HOST} \"cd ${DEPLOY_CTRL_SERVER_DIST} && DOCKER_BUILDKIT=1 docker build -t wafl-node:latest .\"",
  "echo '📤 Pushing Docker image to registry...'",
  "ssh ${DEPLOY_CTRL_SERVER_USER}@${DEPLOY_CTRL_SERVER_HOST} \"docker tag wafl-node:latest localhost:5000/wafl-node:latest && docker push localhost:5000/wafl-node:latest\"",
  "echo '🚀 Pulling image and syncing files on all nodes...'",
  "ssh ${DEPLOY_CTRL_SERVER_USER}@${DEPLOY_CTRL_SERVER_HOST} \"cd ${DEPLOY_CTRL_SERVER_DIST} && set -a && source .env && set +a && .venv/bin/python -u ctrl/deploy.py\"",
  "echo '🧹 Cleaning up...'",
  "ssh ${DEPLOY_CTRL_SERVER_USER}@${DEPLOY_CTRL_SERVER_HOST} \"docker image prune -f\"",
  "echo '🎉 Deployment completed!'",
]

[tasks.start]
depends = ["deploy"]
run = [
  "ssh ${DEPLOY_CTRL_SERVER_USER}@${DEPLOY_CTRL_SERVER_HOST} \"screen -dmS wafl bash -c 'cd ${DEPLOY_CTRL_SERVER_DIST} && set -a && source .env && set +a && .venv/bin/python -u ctrl/main.py'\"",
]

[tasks.experiments]
description = "Run all experiments from ctrl/parameters/ sequentially"
depends = ["deploy"]
run = [
  "ssh ${DEPLOY_CTRL_SERVER_USER}@${DEPLOY_CTRL_SERVER_HOST} \"screen -dmS wafl bash -c 'cd ${DEPLOY_CTRL_SERVER_DIST} && set -a && source .env && set +a && .venv/bin/python -u ctrl/run_experiments.py'\"",
]

[tasks.analyze]
description = "Analyze experiment results on management server and collect results"
run = [
  "echo '📥 Collecting results from all nodes...'",
  "ssh ${DEPLOY_CTRL_SERVER_USER}@${DEPLOY_CTRL_SERVER_HOST} \"cd ${DEPLOY_CTRL_SERVER_DIST} && .venv/bin/python -u ctrl/analyze.py --collect\"",
  "echo '📥 Downloading collected results...'",
  "rsync -arhvz --progress ${DEPLOY_CTRL_SERVER_USER}@${DEPLOY_CTRL_SERVER_HOST}:${DEPLOY_CTRL_SERVER_DIST}/results .",
  "echo '📊 Running analysis locally...'",
  ".venv/bin/python -u ctrl/analyze.py --generate",
  ".venv/bin/python -u ctrl/analyze.py --additional",
  "echo '✨ Analysis complete!'",
]

[tasks.sumo]
description = "Complete mobility preprocessing pipeline (unified script)"
run = [
  ".venv/bin/python -u utils/prepare_mobility.py --config ctrl/execution_config.json --pathloss data/sumo/path_loss_model.json --output-dir data/sumo/ --epochs 2200",
  ".venv/bin/python -u utils/visualize_sumo_results.py --trace data/sumo/mobility_trace.csv --contact data/sumo/contact_pattern_mobility.json --conditions data/sumo/network_conditions_mobility.json --mode all --output-dir data/sumo/visuals/",
]

[tasks.sumo-osm]
description = "Mobility preprocessing with OSM real-world map"
run = [
  ".venv/bin/python -u utils/prepare_mobility.py --config ctrl/execution_config.json --pathloss data/sumo/path_loss_model.json --output-dir data/sumo_real/ --osm data/osm/map.osm --epochs 2200",
  ".venv/bin/python -u utils/visualize_sumo_results.py --trace data/sumo_real/mobility_trace.csv --contact data/sumo_real/contact_pattern_mobility.json --conditions data/sumo_real/network_conditions_mobility.json --network data/sumo_real/network.net.xml --mode all --output-dir data/sumo_real/visuals/",
]

[tasks.verify]
description = "Run both verification and benchmarks"
depends = ["deploy"]
run = [
  "ssh ${DEPLOY_CTRL_SERVER_USER}@${DEPLOY_CTRL_SERVER_HOST} \"cd ${DEPLOY_CTRL_SERVER_DIST} && .venv/bin/python -u ctrl/verify.py --all\"",
  "rsync -arhvz --progress --inplace ${DEPLOY_CTRL_SERVER_USER}@${DEPLOY_CTRL_SERVER_HOST}:${DEPLOY_CTRL_SERVER_DIST}/results .",
]
