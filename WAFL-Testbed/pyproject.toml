[project]
name = "wafl-testbed"
version = "0.1.0"
description = "The WAFL Emulation Testbed project, launched in April 2025, is trying to develop a research platform for WAFL's device-to-device collaborative learning over real TCP/IP-based communications."
readme = "README.md"
requires-python = "==3.11.4"
dependencies = [
    "numpy>=2.3.1",
    "pre-commit>=4.2.0",
    "ruff>=0.12.0",
    "torch>=2.7.1",
    "paramiko>=2.12.0",
    "torchvision>=0.22.1",
    "pandas>=2.3.2",
    "matplotlib>=3.10.6",
    "seaborn>=0.13.2",
    "functions>=0.7.0",
    "tqdm>=4.67.1",
    "psutil>=5.9.0",
    "zfec>=1.5.0",
    "lz4>=4.3.3",
    "traci>=1.25.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "wafl"}

[tool.setuptools.packages.find]
where = ["wafl"]

[tool.ruff]
target-version = "py311"
builtins = ["_"]
exclude = [
    ".git",
    ".venv",
    "assets",
]
indent-width = 4
line-length = 512

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I"]
